# Render blueprint for the backend. Free tier: the instance sleeps after 15
# minutes idle and its disk is wiped on restart — which is why the database
# is Neon, not a file, and why an external uptime ping is worth setting up.
services:
  - type: web
    name: lacuna-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    # Schema migrations run from the app's startup hook (db_schema.create_db_and_tables),
    # so there is nothing to run here: one instance, one upgrade, before the first
    # request is served. Scaling past one instance means moving that to a
    # pre-deploy step — see the docstring on that function.
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DATABASE_URL
        sync: false   # paste the Neon connection string in the dashboard
      - key: GEMINI_API_KEY
        sync: false   # never in the repo
      # The code default (gemini-2.5-flash) is refused for API keys created
      # after Google closed that model to new projects — a 404 on the first
      # /weak-spots call, seen at the first deploy. 3.6-flash is the model
      # Google's error names, verified live on 2026-09-15.
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: ALLOWED_ORIGINS
        sync: false   # the Vercel URL, e.g. https://lacuna-cloud.vercel.app

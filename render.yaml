# Render blueprint for the backend. Free tier: the instance sleeps after 15
# minutes idle and its disk is wiped on restart — which is why the database
# is Neon, not a file, and why an external uptime ping is worth setting up.
services:
  - type: web
    name: study-helper-api
    runtime: python
    plan: free
    rootDir: study-helper-beta
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DATABASE_URL
        sync: false   # paste the Neon connection string in the dashboard
      - key: GEMINI_API_KEY
        sync: false   # never in the repo
      - key: ALLOWED_ORIGINS
        sync: false   # the Vercel URL, e.g. https://study-helper.vercel.app
